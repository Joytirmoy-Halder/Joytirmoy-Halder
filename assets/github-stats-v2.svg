<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Joytirmoy Halder GitHub statistics: 19 public repositories, 104 commits, 132 contributions, 12 stars, 8 shipped plugins, 14 live domains. Language distribution by repository: PHP 72 percent, HTML 11 percent, CSS 6 percent, C-sharp 6 percent, Jupyter Notebook 6 percent.">
  <style>
