  </style>

  <rect x="0.5" y="0.5" width="899" height="249" rx="10" fill="#0D1117" stroke="#e0a42b" stroke-opacity="0.28"/>
  <rect x="0.5" y="0.5" width="899" height="3" rx="1.5" fill="#e0a42b" fill-opacity="0.55"/>

